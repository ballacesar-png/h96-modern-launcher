
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H96 Modern Launcher</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;color:white;font-family:Arial,sans-serif;
 background:radial-gradient(ellipse at 50% 55%,#173c67,#080d20 75%);
 height:100vh;overflow:hidden;
}
header{
 height:90px;display:flex;align-items:center;
 justify-content:space-between;padding:0 55px;
}
.logo{font-size:27px;font-weight:bold;letter-spacing:2px}
.info{color:#b9c9e9;font-size:17px}
main{
 height:65vh;display:flex;align-items:center;
 justify-content:center;gap:28px;
}
.app{
 width:145px;height:145px;border-radius:30px;
 background:#17263e;display:flex;align-items:center;
 justify-content:center;font-size:55px;
 border:2px solid #344a69;opacity:.65;
 transition:.3s;flex-shrink:0;
}
.app.selected{
 width:270px;height:270px;font-size:105px;
 opacity:1;border:3px solid #54c8ff;
 box-shadow:0 0 45px #168eff;
 transform:scale(1.04);
}
.name{text-align:center;font-size:25px;margin-top:15px}
footer{
 position:absolute;bottom:45px;width:100%;
 text-align:center;color:#9cb3d6;font-size:16px;
}
</style>
</head>
<body>
<header>
 <div class="logo">H96 MODERN</div>
 <div class="info">SMART TV  ·  10:00</div>
</header>
<main id="apps"></main>
<div class="name" id="name">Netflix</div>
<footer>◀ ▶ Navegar　 ENTER Seleccionar　 HOME Inicio</footer>
<script>
const items=[
 ["🎬","Netflix"],["▶️","YouTube"],
 ["📺","Prime Video"],["🎞️","Disney+"],
 ["🎮","Juegos"],["⚙️","Ajustes"]
];
let current=0;
function render(){
 const area=document.getElementById("apps");
 area.innerHTML="";
 items.forEach((item,i)=>{
  let el=document.createElement("div");
  el.className="app"+(i===current?" selected":"");
  el.textContent=item[0];
  area.appendChild(el);
 });
 document.getElementById("name").textContent=items[current][1];
}
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowRight")current=(current+1)%items.length;
 if(e.key==="ArrowLeft")current=(current-1+items.length)%items.length;
 render();
});
render();
</script>
</body>
</html>
